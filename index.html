<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lugrasimo&family=Narnoor:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body>

  <div class="grid-container">
    <header>
      <p>My Library<img src="books.png" alt="image-books"></p>
    </header>
    <button class="new-book-btn">New Book</button>

    <form id="book-form" class="hidden" action="">

      <label for="title">Title:</label>
      <input type="text" id="title" name="title">

      <label for="author">Author:</label>
      <input type="text" id="author" name="author">

      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages">

      <label for="isRead">Have Read:</label>
      <input type="checkbox" id="isRead" name="isRead">

      <button type="submit" class="new-book-submit-btn">Submit</button>

    </form>

    <ul class="book-cards">

    </ul>
  </div>



</body>

</html>
